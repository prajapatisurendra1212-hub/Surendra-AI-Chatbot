<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SPAI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f4f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 500px;
      height: 90vh;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      font-size: 22px;
    }

    .header p {
      font-size: 12px;
      margin-top: 5px;
      opacity: 0.8;
    }

    .api-section {
      padding: 12px;
      background: #f8fafc;
      border-bottom: 1px solid #ddd;
    }

    .api-section input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      max-width: 85%;
      padding: 11px 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }

    .bot {
      background: #e5e7eb;
      color: #111827;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
    }

    .input-area button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .input-area button:disabled {
      background: #999;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      <h1>🤖 SPAI Chatbot</h1>
      <p>Powered by Groq API</p>
    </div>

    <!-- GROQ API KEY -->
    <div class="api-section">
      <input
        type="password"
        id="apiKey"
        placeholder="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"
      >
    </div>

    <!-- CHAT -->
    <div class="chat-box" id="chatBox">
      <div class="message bot">
        Hello! 👋 I am SPAI Chatbot. How can I help you?
      </div>
    </div>

    <!-- MESSAGE INPUT -->
    <div class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Type your message..."
      >

      <button id="sendBtn" onclick="sendMessage()">
        Send
      </button>
    </div>

  </div>


  <script>

    const userInput = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    const sendBtn = document.getElementById("sendBtn");


    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = "message " + type;

      message.textContent = text;

      chatBox.appendChild(message);

      chatBox.scrollTop = chatBox.scrollHeight;
    }


    async function sendMessage() {

      const apiKey =
        document.getElementById("apiKey").value.trim();

      const message =
        userInput.value.trim();


      // Check API key
      if (!apiKey) {

        alert("Please enter your Groq API Key.");

        return;
      }


      // Check message
      if (!message) {

        return;
      }


      // Show user message
      addMessage(message, "user");

      userInput.value = "";

      sendBtn.disabled = true;
      sendBtn.textContent = "Sending...";


      try {

        const response = await fetch(
          "https://api.groq.com/openai/v1/chat/completions",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + apiKey
            },

            body: JSON.stringify({

              model: "llama-3.3-70b-versatile",

              messages: [

                {
                  role: "system",
                  content:
                    "You are SPAI Chatbot, a helpful AI assistant. Answer clearly and politely."
                },

                {
                  role: "user",
                  content: message
                }

              ],

              temperature: 0.7,

              max_tokens: 1000

            })
          }
        );


        const data = await response.json();


        if (!response.ok) {

          throw new Error(
            data.error?.message ||
            "Groq API request failed."
          );
        }


        const reply =
          data.choices?.[0]?.message?.content;


        if (!reply) {

          throw new Error("No response received from Groq.");
        }


        addMessage(reply, "bot");


      } catch (error) {

        addMessage(
          "Error: " + error.message,
          "bot"
        );

      }


      sendBtn.disabled = false;
      sendBtn.textContent = "Send";
    }


    // Enter key से message भेजना
    userInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          sendMessage();

        }

      }
    );

  </script>

</body>
</html>
